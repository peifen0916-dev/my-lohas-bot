name: 台股尾盤量化掃描與 Telegram 推播

on:
  # 1. 支援在 GitHub App / 網頁版手動按鈕觸發 (workflow_dispatch)
  workflow_dispatch:

  # 2. 自動定時排程：台灣時間 13:24 (即 UTC 時間 05:24)
  schedule:
    - cron: '24 5 * * 1-5'

jobs:
  run-quant-scan:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝 Python 套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行尾盤量化掃描
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python daily_scanner.py
