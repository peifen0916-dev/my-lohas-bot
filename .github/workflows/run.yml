name: Lohas 5-Line Daily Monitor

on:
  schedule:
    # 每天台灣時間中午 12:00 自動執行 (等於 UTC 時間 04:00)
    - cron: '16 4 * * 1-5'
  workflow_dispatch:
    # 允許您未來透過網頁或手機 App 手動點擊按鈕，立刻強制執行

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance numpy requests

    - name: 執行樂活五線譜監控
      # 將 GitHub 後台的 Secrets 轉換成 Python 看得見的環境變數
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python lohas_monitor.py
