<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>樂活股票清單管理</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { 
            --bg-color: #f4f6f9; 
            --card-bg: #ffffff; 
            --primary: #2ea44f; 
            --text: #24292e; 
            --gray: #6a737d; 
            --danger: #cf222e;
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 24px; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 22px; text-align: center; }
        .hint { font-size: 13px; color: var(--gray); margin-bottom: 15px; text-align: center; line-height: 1.5; }
        input, select { width: 100%; padding: 12px; border: 1px solid #d0d7de; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #fff; outline: none; }
        input[type="password"] { background: #fafafa; }
        
        /* 股票標籤視覺化區域 */
        .section-title { font-size: 14px; font-weight: bold; color: var(--text); margin: 15px 0 6px 0; text-align: left; width: 100%; }
        .stock-container { background: #fafafa; border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; min-height: 70px; display: flex; flex-wrap: wrap; gap: 6px; box-sizing: border-box; margin-bottom: 15px; }
        .stock-tag { background: #f1f3f5; color: #343a40; padding: 5px 10px; border-radius: 6px; font-weight: 600; font-size: 14px; border: 1px solid #e9ecef; }
        
        /* 動態操作排版 */
        .action-block { background: #f8f9fa; padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px dashed #d0d7de; }
        .action-row { display: flex; gap: 8px; margin-top: 5px; }
        .action-row input, .action-row select { flex: 1; padding: 8px 10px; font-size: 14px; }
        .btn-sm { width: auto; padding: 8px 14px; font-size: 14px; margin-top: 0; white-space: nowrap; }
        .btn-add { background-color: #ddf4ff; color: #0969da; }
        .btn-delete { background-color: #ffebe9; color: var(--danger); }

        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 5px; }
        button:disabled { background-color: #94d3a2; cursor: not-allowed; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
        .success { color: #2ea44f; } .error { color: #cf222e; } .loading { color: #0969da; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>📈 樂活盯盤清單修改</h2>
    
    <div id="lockZone">
        <div class="hint">請輸入您的 GitHub Fine-grained Token 進行身分驗證：</div>
        <input type="password" id="tokenInput" placeholder="github_pat_...">
        <button onclick="saveTokenAndInit()">🔑 驗證並登入</button>
    </div>

    <div id="mainZone" class="hidden">
        <div class="hint">輸入股票名稱或代碼點擊搜尋，系統會自動轉換為 Yahoo 專用代碼。</div>
        
        <div class="section-title">📋 目前監控中的股票清單</div>
        <div id="stockContainer" class="stock-container"></div>

        <div class="action-block">
            <div class="section-title" style="margin-top:0;">➕ 加入股票</div>
            <div class="action-row">
                <input type="text" id="addInput" placeholder="例如: 台積電 或 2330">
                <button class="btn-sm btn-add" id="searchBtn" onclick="searchStock()">🔍 搜尋</button>
            </div>
            <select id="searchResultSelect" class="hidden" style="margin-top: 8px;" onchange="confirmAddStock()">
                <option value="">請選擇搜尋到的正確標的...</option>
            </select>
        </div>

        <div class="action-block">
            <div class="section-title" style="margin-top:0;">❌ 刪除股票</div>
            <div class="action-row">
                <select id="deleteSelect">
                    <option value="">請選擇股票...</option>
                </select>
                <button class="btn-sm btn-delete" onclick="deleteStock()">刪除</button>
            </div>
        </div>
        
        <button id="saveBtn" onclick="updateGitHubFile()">💾 同步更新至雲端</button>
        <button onclick="clearToken()" style="background-color: var(--danger); margin-top: 10px;">🚪 登出並清除金鑰</button>
    </div>
    
    <div id="status"></div>
</div>

<script>
    let GITHUB_TOKEN = "";
    const OWNER = "peifen0916-dev"; 
    const REPO = "my-lohas-bot";
    const FILE_PATH = "lohas_monitor.py";

    const statusDiv = document.getElementById('status');
    const saveBtn = document.getElementById('saveBtn');
    
    let stockList = [];
    const nameCache = {}; 

    // 🔥 核心優化：內建核心對照表，讓常用個股在網頁開起來時「完全免等待」直接顯示中文！
    const localStockDict = {
        "2330.TW": "台積電",
        "0050.TW": "元大台灣50",
        "3293.TWO": "鈊象",
        "8069.TWO": "元太",
        "3711.TW": "日月光投控",
        "6953.TWO": "巧新",
        "6625.TW": "必應"
    };

    window.onload = function() {
        const savedToken = localStorage.getItem('lohas_github_token');
        if (savedToken) {
            GITHUB_TOKEN = savedToken;
            document.getElementById('lockZone').classList.add('hidden');
            document.getElementById('mainZone').classList.remove('hidden');
            fetchCurrentList();
        }
    }

    function saveTokenAndInit() {
        const token = document.getElementById('tokenInput').value.trim();
        if (!token.startsWith('github_pat_')) {
            showStatus("❌ 格式不正確，必須是 github_pat_ 開頭的完整 Token", "error");
            return;
        }
        localStorage.setItem('lohas_github_token', token);
        GITHUB_TOKEN = token;
        document.getElementById('lockZone').classList.add('hidden');
        document.getElementById('mainZone').classList.remove('hidden');
        fetchCurrentList();
    }

    function clearToken() {
        localStorage.removeItem('lohas_github_token');
        location.reload();
    }

    // 🔥 核心修復：放棄不穩定的 HTML 爬蟲，改採官方繁體中文 JSON API 管道
    async function fetchStockName(code) {
        if (localStockDict[code]) return localStockDict[code];
        if (nameCache[code]) return nameCache[code];
        try {
            const targetUrl = `https://query1.finance.yahoo.com/v1/finance/search?q=${code}&quotesCount=1&newsCount=0&lang=zh-Hant-TW&region=TW`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
            const res = await fetch(proxyUrl);
            const data = await res.json();
            
            if (data.quotes && data.quotes.length > 0) {
                const name = data.quotes[0].shortname || data.quotes[0].longname || code;
                nameCache[code] = name;
                return name;
            }
        } catch (e) { console.error("無法取得名稱:", e); }
        return code; 
    }

    // 渲染介面
    function renderUI() {
        const container = document.getElementById('stockContainer');
        const select = document.getElementById('deleteSelect');
        
        if (stockList.length === 0) {
            container.innerHTML = '<span style="color: #6a737d; font-size: 14px;">目前清單空空如也</span>';
        } else {
            container.innerHTML = stockList.map(stock => {
                const displayName = localStockDict[stock] || nameCache[stock] || stock;
                const title = displayName !== stock ? `${displayName} (${stock})` : stock;
                return `<span class="stock-tag" id="tag-${stock.replace('.', '_')}">${title}</span>`;
            }).join('');
        }

        select.innerHTML = '<option value="">請選擇股票...</option>';
        stockList.forEach(stock => {
            const option = document.createElement('option');
            option.value = stock;
            option.id = `opt-${stock.replace('.', '_')}`;
            const displayName = localStockDict[stock] || nameCache[stock] || stock;
            option.textContent = displayName !== stock ? `${displayName} (${stock})` : stock;
            select.appendChild(option);
        });

        // 針對非列表內的新增股票，在背景默默向雲端補抓繁中名稱
        stockList.forEach(async (stock) => {
            if (!localStockDict[stock] && !nameCache[stock]) {
                const name = await fetchStockName(stock);
                const tagEl = document.getElementById(`tag-${stock.replace('.', '_')}`);
                if (tagEl) tagEl.textContent = `${name} (${stock})`;
                const optEl = document.getElementById(`opt-${stock.replace('.', '_')}`);
                if (optEl) optEl.textContent = `${name} (${stock})`;
            }
        });
    }

    // 智慧型搜尋功能（精準繁中對齊通道）
    async function searchStock() {
        const query = document.getElementById('addInput').value.trim();
        if (!query) { alert('請輸入股票名稱或代碼！'); return; }
        
        const searchBtn = document.getElementById('searchBtn');
        const select = document.getElementById('searchResultSelect');
        
        searchBtn.disabled = true;
        searchBtn.innerText = "🔍 搜尋中...";
        
        try {
            // 🔥 強制指定語言為繁體中文 (zh-Hant-TW) 並且地區為台灣 (TW)
            const targetUrl = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(query)}&quotesCount=5&newsCount=0&lang=zh-Hant-TW&region=TW`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
            
            const res = await fetch(proxyUrl);
            const data = await res.json();
            
            select.innerHTML = '<option value="">請點選下方符合的股票加入...</option>';
            
            if (data.quotes && data.quotes.length > 0) {
                data.quotes.forEach(q => {
                    const option = document.createElement('option');
                    option.value = q.symbol;
                    // 優先查找內建字典，若無則採用官方回傳的繁中 shortname
                    const finalName = localStockDict[q.symbol] || q.shortname || q.longname || '未知名稱';
                    nameCache[q.symbol] = finalName;
                    option.textContent = `${finalName} (${q.symbol}) - ${q.exchDisp || ''}`;
                    select.appendChild(option);
                });
                select.classList.remove('hidden');
            } else {
                alert('找不到相符的股票，請嘗試更精準的關鍵字！');
                select.classList.add('hidden');
            }
        } catch (err) {
            alert('搜尋失敗，請稍後再試：' + err.message);
        } finally {
            searchBtn.disabled = false;
            searchBtn.innerText = "🔍 搜尋";
        }
    }

    function confirmAddStock() {
        const select = document.getElementById('searchResultSelect');
        const code = select.value;
        if (!code) return;
        
        if (stockList.includes(code)) {
            alert('該股票已經在清單中囉！');
            select.value = "";
            return;
        }
        
        stockList.push(code);
        document.getElementById('addInput').value = '';
        select.classList.add('hidden');
        select.value = "";
        renderUI();
    }

    function deleteStock() {
        const select = document.getElementById('deleteSelect');
        let target = select.value;
        if (!target) { alert('請先選取一檔要刪除的股票！'); return; }
        stockList = stockList.filter(item => item !== target);
        renderUI();
    }

    async function fetchCurrentList() {
        showStatus("🔍 正在讀取雲端最新股票清單...", "loading");
        saveBtn.disabled = true;
        try {
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
            const res = await fetch(url, { headers: { "Authorization": `token ${GITHUB_TOKEN}` } });
            if (!res.ok) throw new Error("讀取失敗，請確認 Token 權限或是否勾選正確專案");
            const data = await res.json();
            const fileContent = decodeURIComponent(escape(atob(data.content)));
            const match = fileContent.match(/stock_list\s*=\s*(\[[\s\S]*?\])/);
            
            if (match) {
                let rawArrayStr = match[1].replace(/'/g, '"').replace(/“|”/g, '"');
                stockList = JSON.parse(rawArrayStr);
                renderUI();
                showStatus("✅ 已同步最新雲端資料", "success");
            } else {
                showStatus("❌ 找不到股票清單變數", "error");
            }
        } catch (err) {
            showStatus("❌ " + err.message, "error");
            clearToken();
        } finally { saveBtn.disabled = false; }
    }

    async function updateGitHubFile() {
        const newListText = JSON.stringify(stockList); 
        showStatus("🚀 正在送出更新至 GitHub...", "loading");
        saveBtn.disabled = true;
        try {
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
            const res = await fetch(url, { headers: { "Authorization": `token ${GITHUB_TOKEN}` } });
            const fileData = await res.json();
            const sha = fileData.sha;
            const oldContent = decodeURIComponent(escape(atob(fileData.content)));
            const newContent = oldContent.replace(/stock_list\s*=\s*\[[\s\S]*?\]/, `stock_list = ${newListText}`);
            const b64Content = btoa(unescape(encodeURIComponent(newContent)));
            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "📱 完美修復繁體中文對照與搜尋機制", content: b64Content, sha: sha })
            });
            if (updateRes.ok) { 
                showStatus("🎉 雲端股票名單已秒速更新成功！", "success"); 
            } else { 
                throw new Error("GitHub 回報錯誤"); 
            }
        } catch (err) { 
            showStatus("❌ 更新失敗: " + err.message, "error"); 
        } finally { 
            saveBtn.disabled = false; 
        }
    }
    
    function showStatus(msg, type) { statusDiv.innerText = msg; statusDiv.className = type; }
</script>
</body>
</html>
