name: Lohas 5-Line Daily Monitor

on:
  schedule:
    # 每天台灣時間下午 4:00 (16:00) 自動執行 (等於 UTC 時間 08:00)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # 允許您未來透過網頁或手機 App 手動點擊按鈕，立刻強制執行

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v4  # 🌟 已升級

    - name: 設定 Python 環境
      uses: actions/setup-python@v5  # 🌟 已升級
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance numpy requests

    - name: 執行樂活五線譜監控
      run: python lohas_monitor.py
