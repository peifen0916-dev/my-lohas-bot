<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>樂活股票清單管理</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --primary: #2ea44f; --text: #24292e; --gray: #6a737d; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 24px; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 22px; text-align: center; }
        .hint { font-size: 13px; color: var(--gray); margin-bottom: 15px; text-align: center; }
        textarea, input { width: 100%; padding: 12px; border: 1px solid #d0d7de; border-radius: 8px; font-size: 16px; font-family: monospace; box-sizing: border-box; background: #fafafa; }
        textarea { height: 120px; resize: none; margin-bottom: 10px; }
        input { margin-bottom: 15px; background: #fff; }
        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 5px; }
        button:disabled { background-color: #94d3a2; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
        .success { color: #2ea44f; } .error { color: #cf222e; } .loading { color: #0969da; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>📈 樂活盯盤清單修改</h2>
    
    <div id="lockZone">
        <div class="hint">請輸入您的 GitHub Fine-grained Token 进行身分驗證（此金鑰將安全储存在手機本地）：</div>
        <input type="password" id="tokenInput" placeholder="github_pat_...">
        <button onclick="saveTokenAndInit()">🔑 驗證並登入</button>
    </div>

    <div id="mainZone" class="hidden">
        <div class="hint">請輸入完整的股票代碼，以英文引號包起、逗號隔開。<br>上市加 .TW / 上櫃加 .TWO</div>
        <textarea id="stockListInput" placeholder='["0050.TW", "2330.TW", "3293.TWO"]'></textarea>
        <button id="saveBtn" onclick="updateGitHubFile()">💾 同步更新至雲端</button>
        <button onclick="clearToken()" style="background-color: #cf222e; margin-top: 10px;">🚪 登出並清除金鑰</button>
    </div>
    
    <div id="status"></div>
</div>

<script>
    // 🌟 程式碼中完全沒有金鑰！100% 安全！
    let GITHUB_TOKEN = "";
    const OWNER = "peifen0916-dev"; 
    const REPO = "my-lohas-bot";
    const FILE_PATH = "lohas_monitor.py";

    const statusDiv = document.getElementById('status');
    const inputField = document.getElementById('stockListInput');
    const saveBtn = document.getElementById('saveBtn');

    // 網頁開啟時，檢查手機有沒有存過 Token
    window.onload = function() {
        const savedToken = localStorage.getItem('lohas_github_token');
        if (savedToken) {
            GITHUB_TOKEN = savedToken;
            document.getElementById('lockZone').classList.add('hidden');
            document.getElementById('mainZone').classList.remove('hidden');
            fetchCurrentList();
        }
    }

    // 儲存 Token 並初始化
    function saveTokenAndInit() {
        const token = document.getElementById('tokenInput').value.trim();
        if (!token.startsWith('github_pat_')) {
            showStatus("❌ 格式不正確，必須是 github_pat_ 開頭的完整 Token", "error");
            return;
        }
        localStorage.setItem('lohas_github_token', token);
        GITHUB_TOKEN = token;
        document.getElementById('lockZone').classList.add('hidden');
        document.getElementById('mainZone').classList.remove('hidden');
        fetchCurrentList();
    }

    // 清除金鑰（登出）
    function clearToken() {
        localStorage.removeItem('lohas_github_token');
        location.reload();
    }

    async function fetchCurrentList() {
        showStatus("🔍 正在讀取雲端最新股票清單...", "loading");
        saveBtn.disabled = true;
        try {
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
            const res = await fetch(url, { headers: { "Authorization": `token ${GITHUB_TOKEN}` } });
            if (!res.ok) throw new Error("讀取失敗，請確認 Token 權限或是否勾選正確專案");
            const data = await res.json();
            const fileContent = decodeURIComponent(escape(atob(data.content)));
            const match = fileContent.match(/stock_list\s*=\s*(\[[\s\S]*?\])/);
            if (match) {
                inputField.value = match[1].replace(/\s+/g, ' ');
                showStatus("✅ 已同步最新雲端資料", "success");
            } else {
                showStatus("❌ 找不到股票清單變數", "error");
            }
        } catch (err) {
            showStatus("❌ " + err.message, "error");
            clearToken(); // 失敗就強制清除，讓使用者重登
        } finally { saveBtn.disabled = false; }
    }

    async function updateGitHubFile() {
        const newListText = inputField.value.trim();
        if (!newListText.startsWith('[') || !newListText.endsWith(']')) {
            showStatus("❌ 格式錯誤！必須以 [ 開頭，] 結尾", "error");
            return;
        }
        showStatus("🚀 正在送出更新至 GitHub...", "loading");
        saveBtn.disabled = true;
        try {
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
            const res = await fetch(url, { headers: { "Authorization": `token ${GITHUB_TOKEN}` } });
            const fileData = await res.json();
            const sha = fileData.sha;
            const oldContent = decodeURIComponent(escape(atob(fileData.content)));
            const newContent = oldContent.replace(/stock_list\s*=\s*\[[\s\S]*?\]/, `stock_list = ${newListText}`);
            const b64Content = btoa(unescape(encodeURIComponent(newContent)));
            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "📱 手機後台更新", content: b64Content, sha: sha })
            });
            if (updateRes.ok) { showStatus("🎉 雲端股票名單已秒速更新成功！", "success"); } 
            else { throw new Error("GitHub 回報錯誤"); }
        } catch (err) { showStatus("❌ 更新失敗: " + err.message, "error"); } 
        finally { saveBtn.disabled = false; }
    }
    function showStatus(msg, type) { statusDiv.innerText = msg; statusDiv.className = type; }
</script>
</body>
</html>
